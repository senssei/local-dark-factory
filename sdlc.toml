# Project-owned checks; shared runner installed from local-sdlc-kit.
base = "main"
shell = false

[[check]]
name = "tests"
run = ".venv/bin/python -m pytest tests/ -m 'not local_engine' -q"
timeout = 300

[[check]]
name = "lint"
run = ".venv/bin/python -m ruff check ."

[[check]]
name = "format"
run = ".venv/bin/python -m ruff format --check ."

[[check]]
name = "docs"
run = ".venv/bin/python -m mkdocs build --strict"
skip_if_missing = ".venv/bin/mkdocs"

[changelog]
file = "CHANGELOG.md"
runtime_paths = ["dark_factory/"]

[red]
run = ".venv/bin/python -m pytest -x -q {id}"
timeout = 60
not_found = ["no tests ran", "^ERROR: (file or directory )?not found", "ERROR collecting"]
ignore = ["^FAILED\\b", "^\\d+ (failed|passed)", "^=+ ", "^={3,}", "^!+"]
