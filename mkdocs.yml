site_name: Local Dark Factory
site_description: Sovereign, local-first autonomous AI Software Factory orchestrator (Zero Cloud Tokens)
site_author: Sovereign Dark Factory Contributors
site_url: https://senssei.github.io/local-dark-factory/
repo_url: https://github.com/senssei/local-dark-factory
repo_name: senssei/local-dark-factory

theme:
  name: material
  language: en
  palette:
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_source: true
            show_root_heading: true
            show_category_heading: true

nav:
  - Overview: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - Local Inference: local-inference.md
  - Verification & Healing: verification-gates.md
  - CLI Reference: cli.md
  - AI-Native SDLC:
      - Intent & Vision: sdlc/intent.md
      - Technical Spec: sdlc/spec.md
      - Operating Manual: sdlc/claude.md
      - Agent Instructions: sdlc/agents.md
      - Governance & Review: sdlc/review.md
  - Python API:
      - Domain Types: api/domain.md
      - Workflow Engine: api/orchestrator.md
      - Sandbox Fabric: api/sandbox.md
      - Inference Harness: api/harness.md
      - Verification & Healer: api/verification.md
      - Evidence Locker: api/storage.md
